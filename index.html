<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Parque Nelson Mandela</title>

  <!-- Librería A-Frame -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
</head>

<body>

  <a-scene>

    <!-- Recursos -->
    <a-assets>
      <a-asset-item id="parque2" src="parque2.glb"></a-asset-item>
    </a-assets>

    <!-- Modelo 3D del parque -->
    <a-entity
      gltf-model="#parque2"
      position="0 0 0"
      rotation="0 0 0"
      scale="10 10 10">
    </a-entity>

    <!-- Cámara / visitante -->
    <a-entity
      camera
      look-controls
      wasd-controls="acceleration: 20"
      position="0 3 5">
    </a-entity>

  </a-scene>

</body>
</html>
